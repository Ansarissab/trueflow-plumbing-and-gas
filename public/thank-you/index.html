<!doctype html>
<html lang="en-AU">
<head>
  <!--
    Quote success state — the worker redirects here after a successful POST.
    Keeps the highest-intent moment alive: expected callback window + the
    emergency path one glance away. Self-contained by design (no build deps).
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request received | Moral Service</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Your quote request is in. We'll call you within 2 business hours (7am–5pm)." />
  <style>
    :root { --ink: #15171d; --pearl: #fbfaf7; --dust: #f0eee7; --royal: #1327a7; --muted: #545861; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--pearl);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: var(--pearl);
      border: 2px solid var(--ink);
      border-radius: 2px;
      box-shadow: 12px 12px 0 0 var(--royal);
      padding: 40px 36px 36px;
      text-align: center;
    }
    .tick { width: 56px; height: 56px; margin-inline: auto; display: block; }
    .tick circle.ring { fill: var(--royal); }
    .tick path { stroke: var(--pearl); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    h1 {
      margin-top: 20px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: -.01em;
      line-height: 1.05;
      text-transform: uppercase;
      font-weight: 800;
    }
    h1 .hl { color: var(--royal); }
    .promise { margin-top: 14px; color: var(--muted); font-size: 1.05rem; }
    .promise strong { color: var(--ink); }
    .emergency {
      margin-top: 22px;
      padding: 14px 16px;
      background: var(--dust);
      border: 2px solid var(--ink);
      border-radius: 2px;
      font-size: .98rem;
    }
    .emergency a { color: var(--royal); font-weight: 700; }
    .actions { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: .55em;
      padding: .85em 1.4em; border: 2px solid var(--ink); border-radius: 2px;
      font-weight: 800; text-decoration: none; letter-spacing: .02em;
      text-transform: uppercase; font-size: .95rem; color: var(--ink);
      box-shadow: 3px 3px 0 0 var(--ink);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn svg { width: 18px; height: 18px; }
    .btn--primary { background: var(--royal); color: var(--pearl); }
    .btn--ghost { background: transparent; }
    .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 0 var(--ink); }
    .btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 0 var(--ink); }
    footer { margin-top: 34px; color: var(--muted); font-size: .82rem; }
    @media (max-width: 420px) { .card { padding: 32px 22px 30px; } }
  </style>
</head>
<body>
  <main class="card">
    <svg class="tick" viewBox="0 0 56 56" aria-hidden="true">
      <circle class="ring" cx="28" cy="28" r="26" />
      <path d="M18 29l7.5 7.5L38 20.5" />
    </svg>

    <h1>Request <span class="hl">received</span>.</h1>
    <p class="promise">We'll call you <strong>within 2 business hours</strong> (7am&#8211;5pm).</p>

    <p class="emergency">
      Emergency? <a href="tel:1300522107">Call <strong>1300&nbsp;522&nbsp;107</strong> now</a>&ensp;&#8212;&ensp;answered 24/7.
    </p>

    <div class="actions">
      <a class="btn btn--primary" href="tel:1300522107">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11 11 0 0 0 3.4.55 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .55 3.4 1 1 0 0 1-.25 1l-2.2 2.4Z" />
        </svg>
        Call 1300&nbsp;522&nbsp;107
      </a>
      <a class="btn btn--ghost" href="/">Back to homepage</a>
    </div>

    <footer>Moral Service &#183; Licensed plumbing &amp; electrical &#183; Gold Coast QLD</footer>
  </main>
</body>
</html>
